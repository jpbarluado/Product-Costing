<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A2320; --paper:#F6F3EC; --surface:#FFFFFF;
    --accent:#0E6E63; --accent-2:#14837A; --warm:#C6603D;
    --rule:#E6E0D4; --muted:#6E7570; --soft:#EFEADF; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1060px;margin:0 auto;padding:0 24px}
  .serif{font-family:"Fraunces",Georgia,serif}
  .num{font-variant-numeric:tabular-nums}

  header.bar{position:sticky;top:0;z-index:30;background:rgba(246,243,236,.82);backdrop-filter:saturate(1.5) blur(10px);border-bottom:1px solid var(--rule)}
  .bar-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:16px}
  .brand{font-family:"Fraunces",serif;font-weight:600;font-size:18px;letter-spacing:-.01em}
  .cart-btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:9px}
  .cart-btn:hover{background:#0f1815}
  .cart-count{background:var(--warm);color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}

  .hero{padding:76px 0 30px;text-align:center;position:relative}
  .hero .eyebrow{font-size:13px;letter-spacing:.02em;color:var(--warm);font-weight:500;margin-bottom:14px}
  .hero h1{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(40px,7vw,72px);line-height:1.02;letter-spacing:-.02em;margin:0}
  .hero p{color:var(--muted);font-size:clamp(15px,2.3vw,18px);margin:18px auto 0;max-width:46ch}
  .hero .rule{width:48px;height:2px;background:var(--warm);margin:28px auto 0}

  .filter{position:sticky;top:57px;z-index:20;background:rgba(246,243,236,.9);backdrop-filter:blur(6px);padding:14px 0 10px}
  .filter-inner{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;justify-content:center;flex-wrap:wrap}
  .filter-inner::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;border:1px solid var(--rule);background:transparent;border-radius:999px;padding:8px 18px;font-size:13.5px;cursor:pointer;color:var(--muted);transition:all .15s}
  .pill:hover{border-color:var(--accent-2);color:var(--ink)}
  .pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  main{padding:20px 0 90px}
  .cat{margin-top:44px}
  .cat-head{display:flex;align-items:baseline;gap:14px;margin:0 0 22px}
  .cat-head h2{font-family:"Fraunces",serif;font-weight:600;font-size:26px;margin:0;letter-spacing:-.01em}
  .cat-head .line{flex:1;height:1px;background:var(--rule)}
  .cat-head .count{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

  .card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);padding:22px 22px 20px;display:flex;flex-direction:column;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 34px -22px rgba(26,35,32,.5);border-color:var(--accent-2)}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
  .card h3{font-family:"Fraunces",serif;font-weight:600;font-size:19px;margin:0;line-height:1.2}
  .card .price{font-family:"Fraunces",serif;font-weight:600;font-size:19px;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
  .card .desc{color:var(--muted);font-size:14px;margin:9px 0 18px;flex:1}
  .card .foot{display:flex;align-items:center;justify-content:flex-end}
  .add{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:9px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
  .add:hover{background:var(--accent);color:#fff}
  .add.in{background:var(--accent);color:#fff}
  .card.unavail{background:var(--soft);border-style:dashed}
  .card.unavail:hover{transform:none;box-shadow:none;border-color:var(--rule)}
  .card.unavail h3{color:var(--muted)}
  .card.unavail .price{color:var(--muted)}
  .badge-na{display:inline-flex;align-items:center;gap:6px;color:var(--warm);font-weight:600;font-size:13px}
  .badge-na::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warm)}

  .empty-state{text-align:center;color:var(--muted);padding:60px 20px}

  .scrim{position:fixed;inset:0;background:rgba(26,35,32,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(410px,92vw);background:var(--surface);z-index:41;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-24px 0 70px -30px rgba(0,0,0,.5)}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--rule)}
  .drawer-head h2{font-family:"Fraunces",serif;font-weight:600;font-size:20px;margin:0}
  .x{border:none;background:transparent;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
  .drawer-body{flex:1;overflow-y:auto;padding:8px 22px}
  .empty{color:var(--muted);text-align:center;padding:52px 10px;font-size:14px}
  .li{display:flex;gap:12px;align-items:center;padding:15px 0;border-bottom:1px solid var(--soft)}
  .li .li-name{flex:1;font-size:14.5px}
  .li .li-name small{display:block;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
  .qty{display:flex;align-items:center;gap:9px}
  .qty button{width:30px;height:30px;border:1px solid var(--rule);background:var(--surface);border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
  .qty button:hover{border-color:var(--accent);color:var(--accent)}
  .qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  .li-tot{width:82px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .drawer-foot{border-top:1px solid var(--rule);padding:20px 22px}
  .tot-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
  .tot-row .tl{color:var(--muted)}
  .tot-row .tot{font-family:"Fraunces",serif;font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
  .send{width:100%;border:none;background:var(--accent);color:#fff;border-radius:12px;padding:15px;font-size:15px;font-weight:600;cursor:pointer}
  .send:hover{background:#0b5a51}
  .send:disabled{background:var(--rule);color:var(--muted);cursor:not-allowed}
  .send-note{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{border-top:1px solid var(--rule);padding:34px 0;text-align:center;color:var(--muted);font-size:13px}
  footer .fb{font-family:"Fraunces",serif;color:var(--ink);font-size:15px;margin-bottom:4px}
  @media (prefers-reduced-motion:reduce){.drawer,.scrim,.toast,.card{transition:none}}
</style>
</head>
<body>

<header class="bar"><div class="wrap bar-inner">
  <div class="brand" id="brand">Shop</div>
  <button class="cart-btn" id="cartBtn">Your order <span class="cart-count" id="cartCount">0</span></button>
</div></header>

<section class="hero"><div class="wrap">
  <div class="eyebrow" id="heroEyebrow"></div>
  <h1 id="heroTitle">Loading…</h1>
  <p id="heroTag"></p>
  <div class="rule"></div>
</div></section>

<div class="filter"><div class="wrap filter-inner" id="filter"></div></div>

<main class="wrap" id="catalog"></main>

<footer><div class="wrap"><div class="fb" id="footBrand"></div>Made fresh to order — message us anytime.</div></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Your order">
  <div class="drawer-head"><h2>Your order</h2><button class="x" id="closeCart" aria-label="Close">×</button></div>
  <div class="drawer-body" id="cartBody"><div class="empty">Your order is empty.<br>Add something from the menu!</div></div>
  <div class="drawer-foot">
    <div class="tot-row"><span class="tl">Total</span><span class="tot" id="cartTotal">—</span></div>
    <button class="send" id="sendBtn" disabled>Send order</button>
    <div class="send-note" id="sendNote"></div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
"use strict";
const FALLBACK = {
  business:"Barluado's Kitchen", tagline:"Home-cooked lunch, made fresh to order — reserve yours before the lunch break.",
  currency:"PHP", order:{label:"Order on Messenger",url:"https://m.me/syntax.premiero"},
  types:[
    {name:"Lunch menu",products:[
      {name:"Monggo",price:136,description:"Slow-cooked pork monggo, hearty and homestyle, served with rice.",image:"",available:true},
      {name:"Pasta Carbonara",price:165,description:"Creamy carbonara with plenty of bacon.",image:"",available:true},
      {name:"Extra plain rice",price:16,description:"An extra cup of freshly steamed rice.",image:"",available:false}]}
  ]
};

let catalog=null, cart={}, currency="PHP", filterCat="all";
const $=id=>document.getElementById(id);
const numv=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
function fmt(n){ try{ return new Intl.NumberFormat(undefined,{style:"currency",currency}).format(n);}catch(e){return n.toFixed(2);} }
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const keyOf=(t,p)=> (t+"::"+p).replace(/\s+/g,"_");

async function load(){
  try{ const res=await fetch("catalog.json",{cache:"no-store"}); if(!res.ok) throw 0; catalog=await res.json(); }
  catch(e){ catalog=FALLBACK; }
  if(!catalog||!Array.isArray(catalog.types)) catalog=FALLBACK;
  currency=catalog.currency||"PHP";
  render();
}

function render(){
  const biz=catalog.business||"Shop";
  document.title=biz;
  $("brand").textContent=biz; $("footBrand").textContent=biz;
  $("heroTitle").textContent=biz; $("heroTag").textContent=catalog.tagline||"";
  $("heroEyebrow").textContent = catalog.types && catalog.types.length===1 ? catalog.types[0].name : "Our menu";

  const types=catalog.types.filter(t=>t.products&&t.products.length);
  const fbar=$("filter"); fbar.innerHTML="";
  if(types.length>1){
    const mk=(cat,label)=>{ const b=document.createElement("button"); b.className="pill"; b.dataset.cat=cat; b.textContent=label; b.setAttribute("aria-pressed",filterCat===cat); return b; };
    fbar.appendChild(mk("all","All"));
    types.forEach(t=> fbar.appendChild(mk(t.name,t.name)));
  }

  const root=$("catalog"); root.innerHTML="";
  let shown=0;
  types.forEach(t=>{
    if(filterCat!=="all" && t.name!==filterCat) return;
    const sec=document.createElement("section"); sec.className="cat";
    sec.innerHTML='<div class="cat-head"><h2>'+esc(t.name)+'</h2><span class="line"></span><span class="count">'+t.products.length+' item'+(t.products.length!==1?"s":"")+'</span></div>';
    const grid=document.createElement("div"); grid.className="grid";
    t.products.forEach(p=>{
      shown++;
      const k=keyOf(t.name,p.name);
      const na=p.available===false;
      const inCart=cart[k]?"in":"";
      const action = na
        ? '<span class="badge-na">Sorry, currently unavailable</span>'
        : '<button class="add '+inCart+'" data-add="'+k+'" data-name="'+esc(p.name)+'" data-price="'+numv(p.price)+'">'+(inCart?"Added ✓":"Add to order")+'</button>';
      const card=document.createElement("div"); card.className="card"+(na?" unavail":"");
      card.innerHTML='<div class="top"><h3>'+esc(p.name)+'</h3><span class="price">'+fmt(numv(p.price))+'</span></div>'+
        (p.description?'<p class="desc">'+esc(p.description)+'</p>':'<div class="desc"></div>')+
        '<div class="foot">'+action+'</div>';
      grid.appendChild(card);
    });
    sec.appendChild(grid); root.appendChild(sec);
  });
  if(!shown) root.innerHTML='<div class="empty-state">The menu is being updated — check back soon.</div>';
  renderCart();
}

function addToCart(k,name,price){ if(!cart[k]) cart[k]={name,price:numv(price),qty:0}; cart[k].qty++; render(); openCart(); }
function setQty(k,d){ if(!cart[k])return; cart[k].qty+=d; if(cart[k].qty<=0) delete cart[k]; render(); }

function renderCart(){
  const keys=Object.keys(cart);
  $("cartCount").textContent=keys.reduce((s,k)=>s+cart[k].qty,0);
  const body=$("cartBody");
  if(!keys.length){ body.innerHTML='<div class="empty">Your order is empty.<br>Add something from the menu!</div>'; $("cartTotal").textContent=fmt(0); $("sendBtn").disabled=true; return; }
  let total=0;
  body.innerHTML=keys.map(k=>{ const it=cart[k]; const line=it.price*it.qty; total+=line;
    return '<div class="li"><div class="li-name">'+esc(it.name)+'<small>'+fmt(it.price)+' each</small></div>'+
      '<div class="qty"><button data-q="'+k+'" data-d="-1">−</button><span>'+it.qty+'</span><button data-q="'+k+'" data-d="1">+</button></div>'+
      '<div class="li-tot">'+fmt(line)+'</div></div>'; }).join("");
  $("cartTotal").textContent=fmt(total); $("sendBtn").disabled=false;
  const url=((catalog.order&&catalog.order.url)||"").toLowerCase();
  const prefill = url.indexOf("wa.me")>=0||url.indexOf("whatsapp")>=0||url.indexOf("mailto:")===0||url.indexOf("sms:")===0;
  $("sendNote").textContent = prefill ? "Opens with your order ready to send." : "We'll copy your order and open Messenger — just paste and send.";
}

function orderMessage(){
  const keys=Object.keys(cart); let total=0;
  const lines=keys.map(k=>{ const it=cart[k]; const line=it.price*it.qty; total+=line; return "\u2022 "+it.qty+"\u00d7 "+it.name+" \u2014 "+fmt(line); });
  return "Hi "+(catalog.business||"")+"! I'd like to order:\n"+lines.join("\n")+"\n\nTotal: "+fmt(total);
}
function sendOrder(){
  const msg=orderMessage(); const url=(catalog.order&&catalog.order.url)||""; const enc=encodeURIComponent(msg);
  if(!url){ copy(msg); toast("Order copied — send it to the seller."); return; }
  const low=url.toLowerCase();
  if(low.indexOf("mailto:")===0){ location.href=url+(url.indexOf("?")>=0?"&":"?")+"subject="+encodeURIComponent("New order")+"&body="+enc; return; }
  if(low.indexOf("wa.me")>=0||low.indexOf("api.whatsapp")>=0||low.indexOf("web.whatsapp")>=0){ window.open(url+(url.indexOf("?")>=0?"&":"?")+"text="+enc,"_blank"); return; }
  if(low.indexOf("sms:")===0){ location.href=url+(url.indexOf("?")>=0?"&":"?")+"body="+enc; return; }
  copy(msg);
  const ok=confirm("We've copied your order to your clipboard.\n\nNext: we'll open our Messenger chat — just tap the message box and press Paste, then Send.\n\nOpen Messenger now?");
  if(ok){ window.open(url,"_blank"); toast("Order copied — paste it in the chat and send."); }
}
function copy(t){ try{ navigator.clipboard.writeText(t); }catch(e){} }
let toastT=null;
function toast(m){ const el=$("toast"); el.textContent=m; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove("show");},3400); }
function openCart(){ $("drawer").classList.add("open"); $("scrim").classList.add("open"); }
function closeCart(){ $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); }

document.addEventListener("click",function(e){
  const add=e.target.closest("[data-add]"); if(add){ addToCart(add.dataset.add,add.dataset.name,add.dataset.price); return; }
  const q=e.target.closest("[data-q]"); if(q){ setQty(q.dataset.q,parseInt(q.dataset.d,10)); return; }
  const pill=e.target.closest(".pill"); if(pill){ filterCat=pill.dataset.cat; render(); return; }
  if(e.target.closest("#cartBtn")){ openCart(); return; }
  if(e.target.closest("#closeCart")||e.target.id==="scrim"){ closeCart(); return; }
  if(e.target.closest("#sendBtn")){ sendOrder(); return; }
});

load();
</script>
</body>
</html>
