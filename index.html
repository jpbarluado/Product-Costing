<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101826; --paper:#FAF8F4; --surface:#FFFFFF;
    --accent:#0B6E75; --accent-2:#14919B; --warm:#C6603D;
    --rule:#E7E2D9; --muted:#6B7079; --soft:#F1EEE7; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}
  a{color:inherit}
  .num{font-variant-numeric:tabular-nums}

  header.bar{position:sticky;top:0;z-index:30;background:rgba(250,248,244,.85);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--rule)}
  .bar-inner{display:flex;align-items:center;justify-content:space-between;padding:13px 0;gap:16px}
  .brand{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:17px;letter-spacing:-.01em}
  .cart-btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .cart-btn:hover{background:#0a121f}
  .cart-count{background:#fff;color:var(--ink);border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}

  .hero{padding:64px 0 40px;text-align:center}
  .hero h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(34px,6vw,58px);line-height:1.05;letter-spacing:-.02em;margin:0}
  .hero p{color:var(--muted);font-size:clamp(15px,2.4vw,19px);margin:16px auto 0;max-width:52ch}
  .hero .rule{width:54px;height:3px;background:var(--warm);margin:26px auto 0;border-radius:2px}

  .filter{position:sticky;top:53px;z-index:20;background:var(--paper);padding:10px 0 6px}
  .filter-inner{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .filter-inner::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:13.5px;cursor:pointer;color:var(--muted)}
  .pill:hover{border-color:var(--accent-2);color:var(--ink)}
  .pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

  main{padding:14px 0 80px}
  .cat{margin-top:34px}
  .cat h2{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:22px;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
  .thumb{aspect-ratio:4/3;width:100%;object-fit:cover;display:block;background:var(--soft)}
  .thumb-ph{aspect-ratio:4/3;width:100%;display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:34px;color:#fff}
  .card-body{padding:15px 16px 16px;display:flex;flex-direction:column;flex:1}
  .card h3{font-size:15.5px;font-weight:600;margin:0 0 5px}
  .card .desc{color:var(--muted);font-size:13px;flex:1;margin:0 0 14px}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .price{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
  .add{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer}
  .add:hover{background:var(--accent);color:#fff}
  .add.in{background:var(--accent);color:#fff}
  .card.unavail{opacity:.72}
  .card.unavail .thumb,.card.unavail .thumb-ph{filter:grayscale(.7)}
  .badge-na{display:inline-block;background:var(--soft);color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}

  .scrim{position:fixed;inset:0;background:rgba(16,24,38,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--surface);z-index:41;transform:translateX(100%);transition:transform .24s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px -30px rgba(0,0,0,.5)}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--rule)}
  .drawer-head h2{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:18px;margin:0}
  .x{border:none;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted)}
  .drawer-body{flex:1;overflow-y:auto;padding:8px 20px}
  .empty{color:var(--muted);text-align:center;padding:48px 10px;font-size:14px}
  .li{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--soft)}
  .li .li-name{flex:1;font-size:14px}
  .li .li-name small{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:28px;height:28px;border:1px solid var(--rule);background:var(--surface);border-radius:7px;cursor:pointer;font-size:16px;line-height:1}
  .qty button:hover{border-color:var(--accent);color:var(--accent)}
  .qty span{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
  .li-tot{width:78px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
  .drawer-foot{border-top:1px solid var(--rule);padding:18px 20px}
  .tot-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  .tot-row .tot{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
  .send{width:100%;border:none;background:var(--accent);color:#fff;border-radius:11px;padding:14px;font-size:15px;font-weight:600;cursor:pointer}
  .send:hover{background:#0a5a60}
  .send:disabled{background:var(--rule);color:var(--muted);cursor:not-allowed}
  .send-note{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.5px;z-index:60;opacity:0;transition:all .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{border-top:1px solid var(--rule);padding:30px 0;text-align:center;color:var(--muted);font-size:13px}
  @media (prefers-reduced-motion:reduce){.drawer,.scrim,.toast{transition:none}}
</style>
</head>
<body>

<header class="bar"><div class="wrap bar-inner">
  <div class="brand" id="brand">Shop</div>
  <button class="cart-btn" id="cartBtn">Order <span class="cart-count" id="cartCount">0</span></button>
</div></header>

<section class="hero"><div class="wrap">
  <h1 id="heroTitle">Loading…</h1>
  <p id="heroTag"></p>
  <div class="rule"></div>
</div></section>

<div class="filter"><div class="wrap filter-inner" id="filter"></div></div>

<main class="wrap" id="catalog"></main>

<footer><div class="wrap"><span id="footBrand"></span> · Order anytime — we make everything fresh. · <a href="costing.html" style="color:var(--muted);opacity:.6;text-decoration:none">Admin</a></div></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Your order">
  <div class="drawer-head"><h2>Your order</h2><button class="x" id="closeCart" aria-label="Close">×</button></div>
  <div class="drawer-body" id="cartBody"><div class="empty">Your order is empty. Add something tasty!</div></div>
  <div class="drawer-foot">
    <div class="tot-row"><span>Total</span><span class="tot" id="cartTotal">—</span></div>
    <button class="send" id="sendBtn" disabled>Send order</button>
    <div class="send-note" id="sendNote"></div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
"use strict";
const FALLBACK = {
  business:"Northwind Ventures", tagline:"Handcrafted food & gifts, made fresh to order",
  currency:"PHP", order:{label:"Order on Messenger",url:"https://m.me/yourpage"},
  types:[
    {name:"Foods",products:[
      {name:"Beef Tapa Rice Bowl",price:189,description:"Sweet-savoury cured beef, garlic rice and a runny egg.",image:"",available:true},
      {name:"Chicken Adobo Bowl",price:149,description:"Slow-braised chicken in soy and vinegar over steamed rice.",image:"",available:true},
      {name:"Ube Cheese Pandesal (6pc)",price:119,description:"Soft rolls filled with ube halaya and a salty cheese ribbon.",image:"",available:true}]},
    {name:"Crafts",products:[
      {name:"Resin Keychain",price:120,description:"Hand-poured resin charm, each one slightly different.",image:"",available:true},
      {name:"Beaded Bracelet",price:80,description:"Adjustable beaded bracelet with a small charm.",image:"",available:true},
      {name:"Scented Soy Candle",price:189,description:"Clean-burning soy candle in a reusable tin.",image:"",available:true}]}
  ]
};

let catalog=null, cart={}, currency="PHP", filterCat="all";
const $=id=>document.getElementById(id);
const numv=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
function fmt(n){ try{ return new Intl.NumberFormat(undefined,{style:"currency",currency}).format(n);}catch(e){return n.toFixed(2);} }
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const keyOf=(t,p)=> (t+"::"+p).replace(/\s+/g,"_");

function hue(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))%360; return h; }
function placeholder(name){ const h=hue(name); const initials=name.split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
  return '<div class="thumb-ph" style="background:linear-gradient(135deg,hsl('+h+' 45% 42%),hsl('+((h+40)%360)+' 50% 34%))">'+esc(initials)+'</div>'; }
window.__ph=placeholder;

async function load(){
  try{
    const res=await fetch("catalog.json",{cache:"no-store"});
    if(!res.ok) throw new Error("http "+res.status);
    catalog=await res.json();
  }catch(e){ catalog=FALLBACK; }
  if(!catalog||!Array.isArray(catalog.types)) catalog=FALLBACK;
  currency=catalog.currency||"PHP";
  render();
}

function render(){
  const biz=catalog.business||"Shop";
  document.title=biz;
  $("brand").textContent=biz; $("footBrand").textContent=biz;
  $("heroTitle").textContent=biz; $("heroTag").textContent=catalog.tagline||"";

  const types=catalog.types.filter(t=>t.products&&t.products.length);
  const fbar=$("filter"); fbar.innerHTML="";
  if(types.length>1){
    const mk=(cat,label)=>{ const b=document.createElement("button"); b.className="pill"; b.dataset.cat=cat; b.textContent=label; b.setAttribute("aria-pressed",filterCat===cat); return b; };
    fbar.appendChild(mk("all","All"));
    types.forEach(t=> fbar.appendChild(mk(t.name,t.name)));
  }

  const root=$("catalog"); root.innerHTML="";
  types.forEach(t=>{
    if(filterCat!=="all" && t.name!==filterCat) return;
    const sec=document.createElement("section"); sec.className="cat";
    sec.innerHTML="<h2>"+esc(t.name)+"</h2>";
    const grid=document.createElement("div"); grid.className="grid";
    t.products.forEach(p=>{
      const k=keyOf(t.name,p.name);
      const na=p.available===false;
      const inCart=cart[k]?"in":"";
      const media=p.image? '<img class="thumb" src="'+esc(p.image)+'" alt="'+esc(p.name)+'" onerror="this.outerHTML=window.__ph('+JSON.stringify(p.name).replace(/"/g,"&quot;")+')">' : placeholder(p.name);
      const action = na
        ? '<span class="badge-na">Currently unavailable</span>'
        : '<button class="add '+inCart+'" data-add="'+k+'" data-name="'+esc(p.name)+'" data-price="'+numv(p.price)+'">'+(inCart?"Added ✓":"Add")+'</button>';
      const card=document.createElement("div"); card.className="card"+(na?" unavail":"");
      card.innerHTML=media+
        '<div class="card-body"><h3>'+esc(p.name)+'</h3>'+
        '<p class="desc">'+esc(p.description||"")+'</p>'+
        '<div class="card-foot"><span class="price">'+fmt(numv(p.price))+'</span>'+
        action+'</div></div>';
      grid.appendChild(card);
    });
    sec.appendChild(grid); root.appendChild(sec);
  });
  renderCart();
}

function addToCart(k,name,price){ if(!cart[k]) cart[k]={name,price:numv(price),qty:0}; cart[k].qty++; render(); openCart(); }
function setQty(k,d){ if(!cart[k])return; cart[k].qty+=d; if(cart[k].qty<=0) delete cart[k]; render(); }

function renderCart(){
  const keys=Object.keys(cart);
  $("cartCount").textContent=keys.reduce((s,k)=>s+cart[k].qty,0);
  const body=$("cartBody");
  if(!keys.length){ body.innerHTML='<div class="empty">Your order is empty. Add something tasty!</div>'; $("cartTotal").textContent=fmt(0); $("sendBtn").disabled=true; return; }
  let total=0;
  body.innerHTML=keys.map(k=>{ const it=cart[k]; const line=it.price*it.qty; total+=line;
    return '<div class="li"><div class="li-name">'+esc(it.name)+'<small>'+fmt(it.price)+' each</small></div>'+
      '<div class="qty"><button data-q="'+k+'" data-d="-1">−</button><span>'+it.qty+'</span><button data-q="'+k+'" data-d="1">+</button></div>'+
      '<div class="li-tot">'+fmt(line)+'</div></div>'; }).join("");
  $("cartTotal").textContent=fmt(total); $("sendBtn").disabled=false;
}

function orderMessage(){
  const keys=Object.keys(cart); let total=0;
  const lines=keys.map(k=>{ const it=cart[k]; const line=it.price*it.qty; total+=line; return "\u2022 "+it.qty+"\u00d7 "+it.name+" \u2014 "+fmt(line); });
  return "Hi "+(catalog.business||"")+"! I'd like to order:\n"+lines.join("\n")+"\n\nTotal: "+fmt(total);
}
function sendOrder(){
  const msg=orderMessage(); const url=(catalog.order&&catalog.order.url)||""; const enc=encodeURIComponent(msg);
  if(!url){ copy(msg); toast("Order copied \u2014 send it to the seller."); return; }
  const low=url.toLowerCase();
  if(low.indexOf("mailto:")===0){ location.href=url+(url.indexOf("?")>=0?"&":"?")+"subject="+encodeURIComponent("New order")+"&body="+enc; return; }
  if(low.indexOf("wa.me")>=0||low.indexOf("api.whatsapp")>=0||low.indexOf("web.whatsapp")>=0){ window.open(url+(url.indexOf("?")>=0?"&":"?")+"text="+enc,"_blank"); return; }
  if(low.indexOf("sms:")===0){ location.href=url+(url.indexOf("?")>=0?"&":"?")+"body="+enc; return; }
  copy(msg); window.open(url,"_blank"); toast("Order copied \u2014 paste it in the chat that opened.");
}
function copy(t){ try{ navigator.clipboard.writeText(t); }catch(e){} }
let toastT=null;
function toast(m){ const el=$("toast"); el.textContent=m; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove("show");},3200); }
function openCart(){ $("drawer").classList.add("open"); $("scrim").classList.add("open"); }
function closeCart(){ $("drawer").classList.remove("open"); $("scrim").classList.remove("open"); }

document.addEventListener("click",function(e){
  const add=e.target.closest("[data-add]"); if(add){ addToCart(add.dataset.add,add.dataset.name,add.dataset.price); return; }
  const q=e.target.closest("[data-q]"); if(q){ setQty(q.dataset.q,parseInt(q.dataset.d,10)); return; }
  const pill=e.target.closest(".pill"); if(pill){ filterCat=pill.dataset.cat; render(); return; }
  if(e.target.closest("#cartBtn")){ openCart(); return; }
  if(e.target.closest("#closeCart")||e.target.id==="scrim"){ closeCart(); return; }
  if(e.target.closest("#sendBtn")){ sendOrder(); return; }
});

load();
</script>
</body>
</html>
